<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فحص مواقع القرّاء</title>
<style>body{font:16px -apple-system,Helvetica,sans-serif;background:#0f3d33;color:#fff;margin:0;padding:16px}h1{font-size:1.2rem}button{font:inherit;font-weight:700;padding:.8rem 1.2rem;border-radius:12px;border:0;background:#b3541e;color:#fff;margin:.5rem 0}
table{width:100%;border-collapse:collapse;margin-top:10px}td,th{border-bottom:1px solid #ffffff30;padding:.45rem .3rem;text-align:right;font-size:.9rem}.ok{color:#2ee66b;font-weight:700}.no{color:#ff8a7a;font-weight:700}#sum{margin-top:12px;font-size:1rem;line-height:1.7}</style></head><body>
<h1>فحص إمكانية قراءة موجة الصوت (CORS)</h1><div>اضغط الزر وانتظر حتى يكتمل الفحص، ثم أرسل لي صورة النتيجة.</div><button id="go">ابدأ الفحص</button><div id="sum"></div><table id="t"></table>
<script>
const REC={afasy:['مشاري العفاسي','Alafasy_128kbps'],aj:['أحمد العجمي','ahmed_ibn_ali_al_ajamy_128kbps'],bm:['عبدالباسط عبدالصمد · مرتل','Abdul_Basit_Murattal_192kbps'],bj:['عبدالباسط عبدالصمد · مجوّد','Abdul_Basit_Mujawwad_128kbps'],hs:['محمود الحصري','Husary_128kbps'],mn:['محمد صديق المنشاوي · مرتل','Minshawy_Murattal_128kbps'],mnj:['محمد صديق المنشاوي · مجوّد','Minshawy_Mujawwad_192kbps'],bn:['محمود علي البنا','mahmoud_ali_al_banna_32kbps'],tb:['محمد الطبلاوي','Mohammad_al_Tablaway_128kbps'],mq:['ماهر المعيقلي','MaherAlMuaiqly128kbps'],ds:['ياسر الدوسري','Yasser_Ad-Dussary_128kbps'],qt:['ناصر القطامي','Nasser_Alqatami_128kbps'],sd:['عبدالرحمن السديس','Abdurrahmaan_As-Sudais_192kbps'],sh:['سعود الشريم','Saood_ash-Shuraym_128kbps'],jh:['عبدالله عواد الجهني','Abdullaah_3awwaad_Al-Juhaynee_128kbps'],gm:['سعد الغامدي','Ghamadi_40kbps'],hd:['علي الحذيفي','Hudhaify_128kbps'],kr:['كريم منصوري','Karim_Mansoori_40kbps'],pk:['بيشه وا الكردي · سورة كاملة','','https://cdn.mp3quran.net/audio/peshawa-kurdi/r1/',[],268],rk:['رعد الكردي · سورة كاملة','','https://cdn.mp3quran.net/audio/raad-kurdi/r1/',[],221],az:['مصطفى العزاوي · سورة كاملة','','https://cdn.mp3quran.net/audio/mustafa-azzawi/r1/'],ak:['عامر الكاظمي · سورة كاملة','','https://media.way2quran.com/amer-al-kazemi/hafs-an-asim/'],kh:['الحافظ خليل إسماعيل · سورة كاملة','','https://media.way2quran.com/al-hafiz-khalil-ismail/hafs-an-asim/',[],0,1],dr:['ضاري العاصي · سورة كاملة','','https://media.way2quran.com/dary-ibrahim-al-aasy/hafs-an-asim/'],mt:['ميثم التمار · سورة كاملة','','https://archive.org/download/alfirdnbv54446i67656534323543544563432433_gmail_019_201801/']};
const pad=(n,l)=>String(n).padStart(l,'0');
function url(k){ const r=REC[k]; if(r[2]) return r[2]+(r[5]?1:pad(1,3))+'.mp3'; return 'https://everyayah.com/data/'+r[1]+'/001001.mp3'; }
function host(u){ try{ return new URL(u).host; }catch(e){ return u; } }
function viaFetch(u){ return fetch(u,{mode:'cors',headers:{Range:'bytes=0-2047'}}).then(r=>r.ok||r.status===206?'ok':'http '+r.status).catch(()=>'blocked'); }
function viaAudio(u){ return new Promise(res=>{ const a=new Audio(); a.crossOrigin='anonymous'; a.preload='metadata'; let d=false; const f=v=>{ if(d) return; d=true; clearTimeout(t); a.src=''; res(v); }; a.onloadedmetadata=()=>f('ok'); a.oncanplay=()=>f('ok'); a.onerror=()=>f('blocked'); const t=setTimeout(()=>f('timeout'),9000); a.src=u; }); }
const cell=v=>'<td class="'+(v==='ok'?'ok':'no')+'">'+(v==='ok'?'يسمح':v==='blocked'?'ممنوع':v)+'</td>';
document.getElementById('go').onclick=async()=>{ const t=document.getElementById('t'); t.innerHTML='<tr><th>القارئ</th><th>الموقع</th><th>fetch</th><th>صوت</th></tr>'; const hosts={}; 
 for(const k of Object.keys(REC)){ const u=url(k); const [a,b]=await Promise.all([viaFetch(u),viaAudio(u)]); const h=host(u); (hosts[h]=hosts[h]||[]).push(a==='ok'&&b==='ok'); t.insertAdjacentHTML('beforeend','<tr><td>'+REC[k][0]+'</td><td>'+h+'</td>'+cell(a)+cell(b)+'</tr>'); }
 document.getElementById('sum').innerHTML=Object.entries(hosts).map(([h,v])=>h+': '+(v.every(Boolean)?'<span class="ok">يسمح</span>':v.some(Boolean)?'<span class="no">جزئي</span>':'<span class="no">ممنوع</span>')).join('<br>'); };
</script></body></html>
