<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>تجربة الميكروفون مع الصوت</title>
<style>
body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:#f6f8f6;color:#1b2b24;padding:1rem;line-height:1.6}
h1{font-size:1.15rem;margin:.2rem 0 .8rem}
select,button{font:inherit;font-weight:700;width:100%;box-sizing:border-box;min-height:3rem;border-radius:12px;border:1px solid #cbd8cf;background:#fff;padding:.4rem .7rem;margin:.25rem 0}
button.go{background:#1d6a50;color:#fff;border-color:#1d6a50}
button.stop{background:#b3261e;color:#fff;border-color:#b3261e}
.box{background:#fff;border:1px solid #d8e2db;border-radius:12px;padding:.6rem .8rem;margin:.6rem 0}
#tr{font-size:1.25rem;min-height:3.5rem}
#st div{font-size:.95rem;padding:.1rem 0}
#log{font-size:.8rem;color:#55665d;max-height:11rem;overflow:auto;direction:ltr;text-align:left;font-family:ui-monospace,monospace}
.ok{color:#1d6a50}.bad{color:#b3261e}
</style>
</head>
<body>
<h1>تجربة: هل الميكروفون يتتبع صوت القارئ؟</h1>
<select id="sel">
  <option value="https://cdn.mp3quran.net/audio/mustafa-azzawi/r1/001.mp3">العزاوي · الفاتحة</option>
  <option value="https://cdn.mp3quran.net/audio/mustafa-azzawi/r1/112.mp3">العزاوي · الإخلاص</option>
  <option value="https://server8.mp3quran.net/ra3ad/001.mp3">رعد الكردي · الفاتحة</option>
  <option value="https://everyayah.com/data/Alafasy_128kbps/001001.mp3">العفاسي · البسملة (آية)</option>
</select>
<button class="go" id="b1">١) شغّل الصوت</button>
<button class="go" id="b2">٢) شغّل الميكروفون (والصوت شغّال)</button>
<button class="stop" id="b3">إيقاف الكل</button>

<div class="box"><b>اللي سمعه الميكروفون:</b><div id="tr">—</div></div>
<div class="box" id="st"></div>
<div class="box"><b>سجل:</b><div id="log"></div></div>

<script>
(function(){
const $=id=>document.getElementById(id);
const a=new Audio(); a.preload='auto'; a.playsInline=true;
let rec=null, recOn=false, t0=0, results=0, ends=0, errs=[], audioPausedByMic=false, lastCT=0, watch=0;
function log(m){ const d=document.createElement('div'); d.textContent=((Date.now()-t0)/1000).toFixed(1)+'s  '+m; $('log').prepend(d); }
function ui(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const rows=[
    ['الصوت', a.paused?'<span class="bad">واقف</span>':'<span class="ok">شغّال</span>'+' · '+a.currentTime.toFixed(1)+' ث'],
    ['الميكروفون', SR? (recOn?'<span class="ok">شغّال</span>':'واقف') : '<span class="bad">المتصفح لا يدعمه</span>'],
    ['عدد النتائج المسموعة', String(results)],
    ['عدد مرات انقطاع الميكروفون', String(ends)],
    ['أخطاء', errs.length? '<span class="bad">'+errs.join(' ، ')+'</span>' : 'لا يوجد'],
    ['الصوت وقف بسبب الميكروفون؟', audioPausedByMic? '<span class="bad">نعم</span>':'لا']
  ];
  $('st').innerHTML=rows.map(r=>'<div><b>'+r[0]+':</b> '+r[1]+'</div>').join('');
}
a.addEventListener('pause',()=>{ if(recOn){ audioPausedByMic=true; log('الصوت وقف أثناء الميكروفون'); } else log('الصوت وقف'); ui(); });
a.addEventListener('playing',()=>{ log('الصوت يشتغل'); ui(); });
a.addEventListener('error',()=>{ log('خطأ بتحميل الصوت'); errs.push('تحميل الصوت'); ui(); });
$('b1').onclick=()=>{ t0=t0||Date.now(); a.src=$('sel').value; const p=a.play(); if(p&&p.catch) p.catch(e=>{ errs.push('تشغيل الصوت: '+e.name); ui(); }); log('تشغيل الصوت'); };
$('b2').onclick=()=>{
  t0=t0||Date.now();
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ errs.push('لا يوجد SpeechRecognition'); ui(); return; }
  if(rec){ try{ rec.onend=null; rec.stop(); }catch(e){} }
  rec=new SR(); rec.lang='ar-SA'; rec.continuous=true; rec.interimResults=true;
  rec.onstart=()=>{ recOn=true; log('الميكروفون بدأ'); ui(); };
  rec.onresult=e=>{ results++; let t=''; for(let i=e.resultIndex;i<e.results.length;i++) t+=e.results[i][0].transcript+' '; $('tr').textContent=t.trim()||'—'; log('سمع: '+t.trim().slice(0,60)); ui(); };
  rec.onerror=e=>{ errs.push(e.error); log('خطأ ميكروفون: '+e.error); ui(); };
  rec.onend=()=>{ recOn=false; ends++; log('الميكروفون انقطع'); ui(); if(a && !a.paused){ try{ rec.start(); }catch(e){} } };
  try{ rec.start(); }catch(e){ errs.push(e.message); ui(); }
};
$('b3').onclick=()=>{ try{ a.pause(); }catch(e){} if(rec){ try{ rec.onend=null; rec.stop(); }catch(e){} } recOn=false; log('إيقاف'); ui(); };
setInterval(ui,1000);
ui();
})();
</script>
</body>
</html>
