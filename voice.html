const NN=NAMES.map(n=>norm(n).replace(/^ال/,'').replace(/ ال/g,' '));
const ALIAS={'ياسين':36,'يا سين':36,'يس':36,'صاد':38,'ص':38,'قاف':50,'ق':50,'نون':68,'تبارك':67,'عم':78,'عم يتساءلون':78,'بني اسرائيل':17,'المومن':40,'غافر':40,'حم السجده':41,'الفاتحه':1,'الحمد':1,'الاخلاص':112,'قل هو الله احد':112,'المعوذتين':114,'طا ها':20,'طه':20,'ال عمران':3,'الكهف':18,'الرحمن':55,'الواقعه':56,'الملك':67};
function lev(a,b){ const m=a.length,n=b.length; let p=[]; for(let j=0;j<=n;j++) p[j]=j; for(let i=1;i<=m;i++){ const c=[i]; for(let j=1;j<=n;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c; } return p[n]; }
function findSurah(q){
  q=norm(q).replace(/^(سوره|سورة)\s*/,'').replace(/^ال/,'').replace(/ ال/g,' ').trim(); if(!q) return 0;
  if(/^\d+$/.test(q)){ const n=+q; return n>=1&&n<=114?n:0; }
  const al=Object.keys(ALIAS).find(k=>norm(k).replace(/^ال/,'').replace(/ ال/g,' ')===q); if(al) return ALIAS[al];
  let i=NN.indexOf(q); if(i>=0) return i+1;
  i=NN.findIndex(n=>n.startsWith(q)||q.startsWith(n)); if(i>=0) return i+1;
  if(q.length>=3){ i=NN.findIndex(n=>n.includes(q)||q.includes(n)); if(i>=0) return i+1; }
  if(q.length>=4){ let best=-1,bd=9; NN.forEach((n,k)=>{ if(n.length<4) return; const d=lev(q,n); if(d<bd){ bd=d; best=k; } }); if(best>=0 && bd<=(q.length>=7?2:1)) return best+1; }

}
