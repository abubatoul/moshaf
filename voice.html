<style>

<script>
const NAMES=["الفاتحة","البقرة","آل عمران","النساء","المائدة","الأنعام","الأعراف","الأنفال","التوبة","يونس","هود","يوسف","الرعد","ابراهيم","الحجر","النحل","الإسراء","الكهف","مريم","طه","الأنبياء","الحج","المؤمنون","النور","الفرقان","الشعراء","النمل","القصص","العنكبوت","الروم","لقمان","السجدة","الأحزاب","سبإ","فاطر","يس","الصافات","ص","الزمر","غافر","فصلت","الشورى","الزخرف","الدخان","الجاثية","الأحقاف","محمد","الفتح","الحجرات","ق","الذاريات","الطور","النجم","القمر","الرحمن","الواقعة","الحديد","المجادلة","الحشر","الممتحنة","الصف","الجمعة","المنافقون","التغابن","الطلاق","التحريم","الملك","القلم","الحاقة","المعارج","نوح","الجن","المزمل","المدثر","القيامة","الانسان","المرسلات","النبإ","النازعات","عبس","التكوير","الإنفطار","المطففين","الإنشقاق","البروج","الطارق","الأعلى","الغاشية","الفجر","البلد","الشمس","الليل","الضحى","الشرح","التين","العلق","القدر","البينة","الزلزلة","العاديات","القارعة","التكاثر","العصر","الهمزة","الفيل","قريش","الماعون","الكوثر","الكافرون","النصر","المسد","الإخلاص","الفلق","الناس"];
const COUNTS=[7,286,200,176,120,165,206,75,129,109,123,111,43,52,99,128,111,110,98,135,112,78,118,64,77,227,93,88,69,60,34,30,73,54,45,83,182,88,75,85,54,53,89,59,37,35,38,29,18,45,60,49,62,55,78,96,29,22,24,13,14,11,11,18,12,12,30,52,52,44,28,28,20,56,40,31,50,40,46,42,29,19,36,25,22,17,19,26,30,20,15,21,11,8,8,19,5,8,8,11,11,8,3,9,5,4,7,3,6,3,5,4,5,6];
const REC={afasy:['مشاري العفاسي','Alafasy_128kbps'],aj:['أحمد العجمي','ahmed_ibn_ali_al_ajamy_128kbps'],bm:['عبدالباسط عبدالصمد · مرتل','Abdul_Basit_Murattal_192kbps'],bj:['عبدالباسط عبدالصمد · مجوّد','Abdul_Basit_Mujawwad_128kbps'],hs:['محمود الحصري','Husary_128kbps'],mn:['محمد صديق المنشاوي · مرتل','Minshawy_Murattal_128kbps'],mnj:['محمد صديق المنشاوي · مجوّد','Minshawy_Mujawwad_192kbps'],bn:['محمود علي البنا','mahmoud_ali_al_banna_32kbps'],tb:['محمد الطبلاوي','Mohammad_al_Tablaway_128kbps'],mq:['ماهر المعيقلي','MaherAlMuaiqly128kbps'],ds:['ياسر الدوسري','Yasser_Ad-Dussary_128kbps'],qt:['ناصر القطامي','Nasser_Alqatami_128kbps'],sd:['عبدالرحمن السديس','Abdurrahmaan_As-Sudais_192kbps'],sh:['سعود الشريم','Saood_ash-Shuraym_128kbps'],jh:['عبدالله عواد الجهني','Abdullaah_3awwaad_Al-Juhaynee_128kbps'],gm:['سعد الغامدي','Ghamadi_40kbps'],hd:['علي الحذيفي','Hudhaify_128kbps'],kr:['كريم منصوري','Karim_Mansoori_40kbps'],pk:['بيشه وا الكردي · سورة كاملة','','https://cdn.mp3quran.net/audio/peshawa-kurdi/r1/',[],268],rk:['رعد الكردي · سورة كاملة','','https://cdn.mp3quran.net/audio/raad-kurdi/r1/',[],221],az:['مصطفى العزاوي · سورة كاملة','','https://cdn.mp3quran.net/audio/mustafa-azzawi/r1/'],ak:['عامر الكاظمي · سورة كاملة','','https://media.way2quran.com/amer-al-kazemi/hafs-an-asim/'],kh:['الحافظ خليل إسماعيل · سورة كاملة','','https://media.way2quran.com/al-hafiz-khalil-ismail/hafs-an-asim/',[],0,1],dr:['ضاري العاصي · سورة كاملة','','https://media.way2quran.com/dary-ibrahim-al-aasy/hafs-an-asim/'],mt:['ميثم التمار · سورة كاملة','','https://archive.org/download/alfirdnbv54446i67656534323543544563432433_gmail_019_201801/']};
// ====== المصحف بالصوت: ملف منفصل لا يمس التطبيق الأساسي ======
const $=id=>document.getElementById(id);
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const LS='mqv_'; const lsGet=(k,d)=>{ try{ const v=localStorage.getItem(LS+k); return v==null?d:JSON.parse(v); }catch(e){ return d; } }; const lsSet=(k,v)=>{ try{ localStorage.setItem(LS+k,JSON.stringify(v)); }catch(e){} };
let rec=lsGet('rec','afasy'), surah=lsGet('surah',1), ayah=lsGet('ayah',1), gapListen=lsGet('gap',true);
if(!REC[rec]) rec='afasy';
const audio=new Audio(); audio.preload='auto'; let playing=false, token=0, started=false;
const pad=(n,l)=>String(n).padStart(l,'0');
const AR_DIG='٠١٢٣٤٥٦٧٨٩';
function norm(s){ return String(s||'').replace(/[ؐ-ًؚ-ٰٟۖ-ۭـ]/g,'').replace(/[ٱآأإ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/ء/g,'').replace(/[٠-٩]/g,d=>AR_DIG.indexOf(d)).replace(/[^0-9ا-ي ]/g,' ').replace(/\s+/g,' ').trim(); }
function say(t){ return new Promise(res=>{ try{ if(!window.speechSynthesis){ res(); return; } speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang='ar-SA'; u.rate=0.95; const v=(speechSynthesis.getVoices()||[]).find(x=>/^ar/i.test(x.lang)); if(v) u.voice=v; u.onend=u.onerror=()=>res(); speechSynthesis.speak(u); setTimeout(res,12000); }catch(e){ res(); } }); }
function show(t,big){ $('st').textContent=t; if(big!=null) $('bigT').textContent=big; }
const NN=NAMES.map(n=>norm(n).replace(/^ال/,'').replace(/ ال/g,' '));
function findSurah(q){
  q=norm(q).replace(/^(سوره|سورة)\s*/,'').replace(/^ال/,'').replace(/ ال/g,' ').trim(); if(!q) return 0;
  if(/^\d+$/.test(q)){ const n=+q; return n>=1&&n<=114?n:0; }
  let i=NN.indexOf(q); if(i>=0) return i+1;
  i=NN.findIndex(n=>n.startsWith(q)||q.startsWith(n)); if(i>=0) return i+1;
  if(q.length>=3){ i=NN.findIndex(n=>n.includes(q)||q.includes(n)); if(i>=0) return i+1; }
  return 0;
}
const NW={واحد:1,احد:1,اثنين:2,اثنان:2,اثنا:2,ثلاثه:3,ثلاث:3,اربعه:4,اربع:4,خمسه:5,خمس:5,سته:6,ست:6,سبعه:7,سبع:7,ثمانيه:8,ثماني:8,ثمان:8,تسعه:9,تسع:9,عشره:10,عشر:10,عشرين:20,ثلاثين:30,اربعين:40,خمسين:50,ستين:60,سبعين:70,ثمانين:80,تسعين:90,مئه:100,ميه:100,مائه:100,مئتين:200,ميتين:200,ثلاثمئه:300};
function numWords(q){ q=q.trim(); if(/^\d+$/.test(q)) return +q; let t=0,any=false; for(const w of q.split(' ')){ if(!w) continue; let k=norm(w); if(NW[k]==null && k[0]==='و' && NW[k.slice(1)]!=null) k=k.slice(1); if(NW[k]!=null){ t+=NW[k]; any=true; } else if(/^\d+$/.test(k)){ t+=+k; any=true; } else return 0; } return any?t:0; }
const KEY={afasy:['عفاسي','مشاري'],aj:['عجمي'],bm:['عبدالباسط','عبد الباسط','باسط'],hs:['حصري'],mn:['منشاوي'],bn:['البنا','بنا'],tb:['طبلاوي'],mq:['معيقلي','ماهر'],ds:['دوسري','ياسر'],qt:['قطامي','ناصر'],sd:['سديس'],sh:['شريم'],jh:['جهني'],gm:['غامدي','سعد'],hd:['حذيفي'],kr:['منصوري','كريم'],pk:['بيشه','بيشوا'],rk:['رعد كردي','رعد الكردي'],az:['عزاوي'],ak:['كاظمي'],kh:['خليل'],dr:['ضاري','العاصي'],mt:['ميثم','التمار']};
function findRec(q){ q=norm(q).replace(/ال/g,''); for(const k in KEY){ for(const w of KEY[k]){ if(q.includes(norm(w).replace(/ال/g,''))) return k; } } return ''; }
function urlFor(s,a){ const r=REC[rec]; if(r[2]) return r[2]+(r[5]?s:pad(s,3))+'.mp3'; return 'https://everyayah.com/data/'+r[1]+'/'+pad(s,3)+pad(a,3)+'.mp3'; }
const isFull=()=>!!REC[rec][2];
const rname=()=>REC[rec][0].split('·')[0].trim();
function save(){ lsSet('rec',rec); lsSet('surah',surah); lsSet('ayah',ayah); lsSet('gap',gapListen); }
function stopAudio(){ token++; playing=false; try{ audio.pause(); }catch(e){} }
function waitEnd(){ return new Promise(res=>{ audio.onended=res; audio.onerror=res; }); }
async function playFrom(s,a){
  stopAudio(); const my=token; surah=s; ayah=a||1; save(); playing=true;
  if(isFull()){
    if((REC[rec][3]||[]).includes(s)){ playing=false; await say('سورة '+NAMES[s-1]+' غير متوفرة عند هذا القارئ'); return; }
    show('سورة '+NAMES[s-1]+' · '+REC[rec][0],'جارٍ التشغيل'); audio.src=urlFor(s,1);
    try{ await audio.play(); }catch(e){ playing=false; show('تعذر التشغيل، تأكد من الإنترنت'); return; }
    await waitEnd(); if(my!==token) return; playing=false;
    if(s<114) playFrom(s+1,1); return;
  }
  while(playing && my===token && surah<=114){
    const n=COUNTS[surah-1];
    while(ayah<=n && my===token){
      show('سورة '+NAMES[surah-1]+' · آية '+ayah+' · '+REC[rec][0],'جارٍ التشغيل'); lsSet('ayah',ayah);
      audio.src=urlFor(surah,ayah);
      try{ await audio.play(); }catch(e){ playing=false; show('تعذر التشغيل، تأكد من الإنترنت'); return; }
      await waitEnd(); if(my!==token) return;
      ayah++;
      if(gapListen && ayah<=n){ const t=await listenOnce(1800,true); if(my!==token) return; if(t){ const r=await handle(t,true); if(r==='stop'||my!==token) return; } }
    }
    if(my!==token) return; surah++; ayah=1; save(); if(surah>114){ playing=false; await say('انتهى المصحف'); return; }
  }
}
let recog=null, lastErr='';
function listenOnce(ms,quiet){
  return new Promise(res=>{
    lastErr='';
    if(!SR){ lastErr='unsupported'; res(''); return; }
    let done=false, got='';
    try{ recog=new SR(); recog.lang='ar-SA'; recog.interimResults=true; recog.maxAlternatives=1; recog.continuous=false;
      const fin=()=>{ if(done) return; done=true; try{ recog.stop(); }catch(e){} $('big').classList.remove('listen'); res(got); };
      recog.onresult=e=>{ try{ const r=e.results[e.results.length-1]; got=r[0].transcript; if(r.isFinal) fin(); }catch(_){} };
      recog.onerror=e=>{ lastErr=(e&&e.error)||'error'; fin(); }; recog.onend=()=>fin();
      $('big').classList.add('listen'); if(!quiet) $('bigT').textContent='أسمعك…';
      recog.start(); setTimeout(fin,ms||6000);
    }catch(e){ lastErr='start:'+(e&&e.message||e); res(''); }
  });
}
function errMsg(){
  if(lastErr==='not-allowed') return 'الميكروفون غير مسموح. افتح الإعدادات، ثم سفاري، ثم الميكروفون، واختر سماح.';
  if(lastErr==='service-not-allowed') return 'فعّل الإملاء الصوتي: الإعدادات، عام، لوحة المفاتيح، تفعيل الإملاء.';
  if(lastErr==='unsupported') return 'هذا المتصفح لا يدعم التعرف على الكلام. استخدم سفاري على آيفون.';
  if(lastErr&&lastErr!=='no-speech'&&lastErr!=='aborted') return 'تعذر الاستماع. الخطأ: '+lastErr;
  return '';
}
const HELP='الأوامر: قل: سورة الملك. أو: القارئ العفاسي. أو: شغّل، أوقف، التالي، السابق، أعد، آية ثلاثين، سورة تالية. وللتحدث مرة ثانية اضغط الزر الكبير.';
function parse(t){
  const q=norm(t); if(!q) return {c:'none'};
  if(/^(اوقف|ايقاف|توقف|وقف|اسكت|قف)( |$)/.test(q)) return {c:'stop'};
  if(/(مساعده|الاوامر|ساعدني|شنو اقول|ماذا اقول)/.test(q)) return {c:'help'};
  if(/(من القاري|من يقرا|مين القاري)/.test(q)) return {c:'who'};
  if(/(بين الايات|الاستماع بين)/.test(q)) return {c:'gap',on:!/(ايقاف|بدون|الغ|اوقف|لا تستمع)/.test(q)};
  if(/(سوره تاليه|السوره التاليه|السوره بعدها)/.test(q)) return {c:'nextS'};
  if(/(سوره سابقه|السوره السابقه|السوره قبلها)/.test(q)) return {c:'prevS'};
  if(/^(التالي|الايه التاليه|التاليه|بعدها|كمل)( |$)/.test(q)) return {c:'next'};
  if(/^(السابق|الايه السابقه|السابقه|قبلها|ارجع)( |$)/.test(q)) return {c:'prev'};
  if(/^(اعد|كرر|اعاده|كرر الايه|اعد الايه)( |$)/.test(q)) return {c:'again'};
  let m;
  if((m=q.match(/^(?:الايه|ايه)\s+(.+)$/))){ const n=numWords(m[1]); if(n) return {c:'ayah',n}; }
  if(/^(شغل|ابدا|تشغيل|شغل القران|استمر)$/.test(q)) return {c:'play'};
  const rk=findRec(q), hasS=/(^| )(سوره)( |$)/.test(q);
  if(rk && hasS){ const sq=q.replace(/(بصوت|القاري|الشيخ).*$/,'').trim(); const sn=findSurah(sq); if(sn) return {c:'surah',n:sn,k:rk}; return {c:'rec',k:rk}; }
  if(rk && (/^(القاري|قاري|بصوت|الشيخ)/.test(q)||NN.indexOf(q.replace(/^ال/,''))<0)) return {c:'rec',k:rk};
  const sn=findSurah(q); if(sn) return {c:'surah',n:sn};
  return {c:'unknown',q};
}
async function handle(t,inGap){
  const p=parse(t); show('سمعتك: '+t);
  switch(p.c){
    case 'none': return '';
    case 'stop': stopAudio(); $('bigT').textContent='اضغط للتحدث'; await say('تم الإيقاف'); return 'stop';
    case 'help': stopAudio(); await say(HELP); return 'stop';
    case 'who': await say('القارئ '+rname()+'، وأنت في سورة '+NAMES[surah-1]); return '';
    case 'gap': gapListen=p.on; save(); await say(p.on?'سأسمع أوامرك بين الآيات':'لن أستمع بين الآيات'); return '';
    case 'rec': rec=p.k; save(); await say('القارئ '+rname()); playFrom(surah,isFull()?1:ayah); return 'stop';
    case 'surah': if(p.k){ rec=p.k; save(); } surah=p.n; ayah=1; save(); await say('سورة '+NAMES[surah-1]+' بصوت '+rname()); playFrom(surah,1); return 'stop';
    case 'nextS': if(surah<114){ await say('سورة '+NAMES[surah]); playFrom(surah+1,1); } return 'stop';
    case 'prevS': if(surah>1){ await say('سورة '+NAMES[surah-2]); playFrom(surah-1,1); } return 'stop';
    case 'next': if(isFull()){ if(surah<114) playFrom(surah+1,1); } else if(ayah<COUNTS[surah-1]) playFrom(surah,ayah+1); else if(surah<114) playFrom(surah+1,1); return 'stop';
    case 'prev': if(isFull()){ if(surah>1) playFrom(surah-1,1); } else if(ayah>1) playFrom(surah,ayah-1); else if(surah>1) playFrom(surah-1,1); return 'stop';
    case 'again': playFrom(surah,isFull()?1:Math.max(1,ayah-(inGap?1:0))); return 'stop';
    case 'ayah': if(isFull()){ await say('هذا القارئ يقرأ السورة كاملة، اختر قارئًا آخر للانتقال إلى آية'); return ''; } if(p.n>=1&&p.n<=COUNTS[surah-1]){ await say('آية '+p.n); playFrom(surah,p.n); return 'stop'; } await say('رقم الآية غير صحيح'); return '';
    case 'play': playFrom(surah,ayah); return 'stop';
    default: if(!inGap) await say('ما فهمت. قل: مساعدة، لسماع الأوامر'); return '';
  }
}
async function session(){
  stopAudio(); try{ speechSynthesis.cancel(); }catch(e){}
  const t=await listenOnce(8000,false); $('bigT').textContent='اضغط للتحدث';
  if(!t){ const m=errMsg(); show(m||'ما سمعت شيئًا. اضغط الزر وقل أمرك مباشرة، مثل: سورة الملك'); await say(m||'ما سمعت شيئًا'); return; }
  await handle(t,false);
}
const SILENT="data:audio/wav;base64,UklGRmQGAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YUAGAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA";
$('big').addEventListener('click',()=>{
  if(!started){ started=true; try{ audio.src=SILENT; const pr=audio.play(); if(pr&&pr.catch) pr.catch(()=>{}); }catch(e){} }
  session();
});
$('bStop').addEventListener('click',()=>{ stopAudio(); try{ speechSynthesis.cancel(); }catch(e){} show('تم الإيقاف','اضغط للتحدث'); });
$('bHelp').addEventListener('click',async()=>{ stopAudio(); show(HELP); await say(HELP); });
window.__v={parse,findSurah,findRec,norm,state:()=>({rec,surah,ayah,playing})};
