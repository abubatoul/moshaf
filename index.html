<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>القرآن الكريم</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Scheherazade+New:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: ترويسة ثابتة للاختيار، عمود قراءة وسط، وشريط تحكم سفلي ثابت للتمرير التلقائي */
:root{
  --bg:#f6f8f5; --surface:#ffffff; --fg:#17231d; --muted:#5d6e64;
  --accent:#1d6a50; --accent-fg:#ffffff; --gold:#9a7a2a; --line:#dbe3dd; --hl:rgba(29,106,80,.13);
  --font-quran:"Amiri Quran","Scheherazade New","Traditional Arabic",serif;
  --font-ui:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --fs:2rem; --lh:2.2;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]):not([data-theme="paper"]){
  --bg:#0e1612; --surface:#16211b; --fg:#e7eee9; --muted:#93a69b;
  --accent:#58c29b; --accent-fg:#0a1410; --gold:#d4b45a; --line:#26362d; --hl:rgba(88,194,155,.17); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1612; --surface:#16211b; --fg:#e7eee9; --muted:#93a69b;
  --accent:#58c29b; --accent-fg:#0a1410; --gold:#d4b45a; --line:#26362d; --hl:rgba(88,194,155,.17); color-scheme:dark}
/* خلفية ورقية لراحة العين */
:root[data-theme="paper"]{
  --bg:#f2e9d6; --surface:#f9f2e2; --fg:#2a2418; --muted:#7a6b50;
  --accent:#2d6a4d; --accent-fg:#ffffff; --gold:#8a6a1c; --line:#dfd2b4; --hl:rgba(45,106,77,.14); color-scheme:light}
*{box-sizing:border-box}
html{scroll-behavior:auto}
html{touch-action:manipulation}
header.hid{display:none}
#hdrLabel{position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);left:50%;transform:translateX(-50%);z-index:8;background:var(--surface);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:.15rem .8rem;font-size:.8rem;opacity:.9;white-space:nowrap}
#hdrLabel[hidden],#toast[hidden]{display:none}
#toast{position:fixed;top:38%;left:50%;transform:translateX(-50%);z-index:30;background:var(--accent);color:var(--accent-fg);border-radius:14px;padding:.7rem 1.4rem;font-size:1.15rem;box-shadow:0 6px 24px rgba(0,0,0,.25);pointer-events:none;white-space:nowrap}
body.vo #play,body.vo .speed,body.vo #fab2,body.vo .apc{display:none!important}
body.vo .bar-in{justify-content:center}
#fixBtn{display:none!important}

body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);margin:0;
  padding-block:0 11.5rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  padding:.6rem max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);
  display:flex;gap:.5rem;align-items:center}
header h1{font-family:var(--font-quran);font-size:1.25rem;margin:0;color:var(--accent);white-space:nowrap;font-weight:400}
header .sel{display:flex;gap:.5rem;flex:1;min-width:0;justify-content:flex-end}
select{font:inherit;font-size:.9rem;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:.45rem .5rem;min-width:0;flex:1;max-width:11rem}
select:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:40rem;margin:0 auto;padding-top:1rem}
.juz-title{text-align:center;color:var(--muted);font-size:.85rem;letter-spacing:.04em;margin:.5rem 0 1.5rem}
.surah{margin:2.5rem 0 1rem;text-align:center;border-block:1px solid var(--gold);padding:.7rem 0;
  font-family:var(--font-quran);font-size:1.6rem;color:var(--gold);scroll-margin-top:5rem}
.bism{text-align:center;font-family:var(--font-quran);font-size:calc(var(--fs) * .95);margin:1rem 0 1.25rem}
#text{font-family:var(--font-quran);font-size:var(--fs);line-height:var(--lh);text-align:justify;text-align-last:center;text-justify:inter-word;overflow-wrap:break-word}
.para1{text-align:center;text-align-last:center}
.sjd{display:inline-block;margin-inline:.25em;padding:0 .55em;font-family:var(--font-ui);font-size:.55em;font-weight:600;line-height:1.8;vertical-align:middle;color:var(--accent);border:1.5px solid var(--accent);border-radius:999px;white-space:nowrap}
.sjd.w{background:var(--accent);color:var(--accent-fg)}
.n{color:var(--gold);font-size:.7em;white-space:nowrap;padding-inline:.1em}
.credit{text-align:center;font-size:.8rem;color:var(--muted);margin:0 0 1rem}.credit a{color:var(--accent)}
.endnav{display:flex;gap:.75rem;justify-content:center;margin:2.5rem 0}
.endnav button{font:inherit;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:.7rem 1.1rem;cursor:pointer}
.endnav button[disabled]{opacity:.4;cursor:default}
.bar{position:fixed;inset:auto 0 0;z-index:9;background:var(--surface);border-top:1px solid var(--line);
  padding:.7rem max(16px,env(safe-area-inset-left,0px)) calc(.7rem + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.bar-in{max-width:40rem;margin:0 auto;display:flex;align-items:center;gap:.75rem}
#play{flex:none;width:3.4rem;height:3.4rem;border-radius:50%;border:0;background:var(--accent);color:var(--accent-fg);font-size:1.3rem;cursor:pointer;display:grid;place-items:center}
.speed{flex:1;min-width:0;display:flex;flex-direction:column;gap:.15rem}
.speed .lab{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--accent);margin:0;height:1.6rem}
.tools{max-width:40rem;margin:.6rem auto 0;display:grid;grid-template-columns:repeat(6,1fr);gap:.35rem}
.tools button{height:2.3rem;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-size:.8rem;cursor:pointer;padding:0 .1rem}
.tools button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.v{border-radius:6px;-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background .25s}
.v.cur,.v.jump{background:var(--hl)}
.w.miss{background:rgba(255,140,0,.38);border-radius:4px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.v.jump{box-shadow:0 0 0 3px var(--hl)}
#gline{position:fixed;top:38vh;inset-inline-start:0;width:12px;height:3px;background:var(--accent);opacity:.7;border-radius:0 3px 3px 0;z-index:8;pointer-events:none}
.go{max-width:40rem;margin:0 auto .7rem;display:grid;grid-template-columns:1fr 6rem auto;gap:.5rem;align-items:center}
.go input{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:.45rem .5rem;min-width:0;text-align:center}
.go[hidden],.set[hidden]{display:none}
.set{max-width:40rem;margin:0 auto .7rem;display:grid;gap:.5rem}
.set .row{display:flex;align-items:center;gap:.5rem}
.set .lbl{flex:none;width:5.4rem;font-size:.8rem;color:var(--muted)}
.seg{flex:1;min-width:0;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:.3rem}
.seg button{height:2.1rem;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:7px;font:inherit;font-size:.8rem;cursor:pointer;padding:0 .1rem}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
#sheet{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))}
#sheet[hidden]{display:none}
.sh-top{display:flex;gap:.5rem;padding:.7rem 0;max-width:40rem;width:100%;margin:0 auto}
.sh-top input{flex:1;min-width:0;font:inherit;font-size:1.05rem;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.6rem .8rem}
.sh-top button{font:inherit;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:0 1rem;cursor:pointer}
.sh-info{max-width:40rem;width:100%;margin:0 auto;font-size:.85rem;color:var(--muted);padding-bottom:.5rem}
.sh-list{flex:1;overflow-y:auto;max-width:40rem;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:.5rem;padding-bottom:1rem}
.hit{text-align:start;font:inherit;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:.65rem .8rem;cursor:pointer;display:block;width:100%}
.hit b{display:block;font-size:.8rem;color:var(--accent);margin-bottom:.25rem;font-weight:600}
.hit span{font-family:var(--font-quran);font-size:1.15rem;line-height:1.9;display:block}
.go select{max-width:none}
.go button{font:inherit;background:var(--accent);color:var(--accent-fg);border:0;border-radius:8px;padding:.5rem 1rem;cursor:pointer}
.go .err{grid-column:1/-1;font-size:.8rem;color:var(--muted);margin:0}
header .hb{flex:none;font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--bg);color:var(--accent);border-radius:8px;height:2.2rem;padding:0 .65rem;cursor:pointer;white-space:nowrap}
.v.bm .n::before{content:"★ ";color:var(--gold)}
#backChip{position:fixed;z-index:8;inset-inline:0;bottom:7rem;display:flex;justify-content:center;pointer-events:none}
#backChip[hidden]{display:none}
#backChip .in{pointer-events:auto;display:flex;align-items:center;background:var(--accent);color:var(--accent-fg);border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.25);max-width:calc(100% - 24px)}
#backChip button{font:inherit;font-size:.85rem;background:none;border:0;color:inherit;cursor:pointer;padding:.5rem .9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#backChip .x{padding:.5rem .8rem;opacity:.8;border-inline-start:1px solid rgba(255,255,255,.3)}
#vpop{position:fixed;z-index:10;inset-inline:12px;bottom:12rem;max-width:34rem;margin:0 auto;display:flex;align-items:center;gap:.6rem;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.25);padding:.55rem .7rem}
#vpop[hidden]{display:none}
#shSheet{position:fixed;inset:0;z-index:31;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px}
#shSheet .card{background:var(--surface);color:var(--fg);border-radius:16px;max-width:24rem;width:100%;padding:1.1rem 1.2rem;box-shadow:0 10px 40px rgba(0,0,0,.4);display:grid;gap:.55rem}
#shSheet h3{margin:0;font-size:1.05rem;color:var(--accent)}
#shTxt{margin:0;font-family:var(--font-quran);font-size:1.15rem;line-height:2;max-height:7.5rem;overflow:auto;color:var(--fg);text-align:center}
#shSheet button{font:inherit;height:2.6rem;border-radius:10px;border:0;background:var(--accent);color:var(--accent-fg);cursor:pointer}
#shSheet button.g{background:none;color:var(--fg);border:1px solid var(--line)}
#vpop span{flex:1;font-size:.85rem;color:var(--muted)}
#vpop button{font:inherit;font-size:.85rem;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);padding:.45rem .8rem;cursor:pointer}
#vpop button.g{background:none;color:var(--fg);border-color:var(--line)}
#bmSheet{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))}
#bmSheet[hidden]{display:none}
.bm-row{display:flex;gap:.4rem;align-items:stretch}
.bm-row .hit{flex:1;min-width:0}
.bm-row .del{flex:none;font:inherit;background:var(--surface);color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:0 .9rem;cursor:pointer}
.set .act{font:inherit;font-size:.85rem;height:2.3rem;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;cursor:pointer}
.set .note{margin:0;font-size:.8rem;color:var(--muted);line-height:1.7}
#instSheet{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px}
#instSheet[hidden]{display:none}
#instSheet .card{background:var(--surface);color:var(--fg);border-radius:16px;max-width:24rem;width:100%;padding:1.1rem 1.2rem;box-shadow:0 10px 40px rgba(0,0,0,.4)}
#instSheet h3{margin:0 0 .6rem;font-size:1.1rem;color:var(--accent)}
#instSheet ol{margin:0 0 .8rem;padding-inline-start:1.3rem;line-height:2;font-size:.95rem}
#instImgs{margin:0 0 .8rem}
#instImgs .tabs{display:flex;gap:6px;margin-bottom:6px}
#instImgs .tabs button{width:auto;height:1.9rem;padding:0 .8rem;font-size:.8rem;background:var(--surface2,#e9e9e4);color:var(--fg)}
#instImgs .tabs button.on{background:var(--accent);color:var(--accent-fg)}
#instImgs .strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
#instImgs figure{margin:0;flex:none;width:112px;text-align:center}
#instImgs img{width:112px;border-radius:10px;border:1px solid rgba(128,128,128,.35);display:block}
#instImgs figcaption{font-size:.72rem;line-height:1.35;margin-top:3px;opacity:.85}
#instZoom{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center}
#instZoom[hidden]{display:none}
#instZoom img{max-width:92vw;max-height:92vh;border-radius:12px}
#instSheet .ar{text-align:center;font-size:2rem;animation:bnc 1s infinite}
@keyframes bnc{50%{transform:translateY(8px)}}
#instSheet button{font:inherit;width:100%;height:2.6rem;border-radius:10px;border:0;background:var(--accent);color:var(--accent-fg);cursor:pointer}
#micBar{max-width:40rem;width:calc(100% - 24px);box-sizing:border-box;overflow:hidden;margin:0 auto .5rem;display:flex;align-items:center;gap:.6rem;background:var(--surface);border:1px solid var(--accent);border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.25);padding:.55rem .7rem}
#micBar[hidden]{display:none}
#micBar .dot{width:.7rem;height:.7rem;border-radius:50%;background:#d33;flex:none;animation:mp 1.2s infinite}
@keyframes mp{50%{opacity:.25}}
#micBar span.t{flex:1;width:0;min-width:0;font-size:.85rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#qmic[hidden]{display:none!important}
#qmic.on{background:#d33;color:#fff;border-color:#d33}
#micBar button{font:inherit;font-size:.85rem;border-radius:8px;border:1px solid var(--line);background:none;color:var(--fg);padding:.45rem .8rem;cursor:pointer}
@media (max-width:430px){header h1{display:none}.bar-in{gap:.5rem}header .hb .bt{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
.retry{font:inherit;background:var(--accent);color:var(--accent-fg);border:0;border-radius:10px;padding:.6rem 1.2rem;cursor:pointer;margin-top:1rem}
#micBtn,#offBtn,#micStop{display:none!important}
#fab{position:fixed;z-index:9;inset-inline-end:14px;bottom:9rem;width:3.4rem;height:3.4rem;border-radius:50%;border:0;background:var(--accent);color:var(--accent-fg);font-size:1.5rem;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.3);cursor:pointer;padding:0}
#fab[hidden]{display:none}
body.vo #fab{background:#d33;color:#fff;animation:fabp 1.4s infinite}
@keyframes fabp{50%{box-shadow:0 0 0 10px rgba(221,51,51,.18)}}
#fsPanel{max-width:40rem;margin:0 auto .6rem;display:flex;align-items:center;gap:.8rem;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.4rem .9rem;box-shadow:0 6px 20px rgba(0,0,0,.2)}
#fsPanel[hidden]{display:none}
#fsPanel .s1{font-family:var(--font-quran);font-size:1rem;color:var(--muted)}
#fsPanel .s2{font-family:var(--font-quran);font-size:1.8rem;color:var(--fg)}
body.vo #fsPanel{display:none}
.tools{grid-template-columns:repeat(5,1fr)!important}
#fab2{position:fixed;z-index:9;inset-inline-end:14px;bottom:13rem;width:3rem;height:3rem;border-radius:50%;border:1.5px solid var(--accent);background:var(--surface);color:var(--accent);font-size:1.3rem;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer;padding:0}
#fab2.on{background:var(--accent);color:var(--accent-fg)}
body.vo #fab2,body.vo #apPanel{display:none}
#apPanel{max-width:40rem;margin:0 auto .6rem;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.5rem .7rem;box-shadow:0 6px 20px rgba(0,0,0,.2);display:grid;gap:.5rem}
#apPanel[hidden]{display:none}
#apPanel .ap-row{display:flex;gap:.5rem;align-items:center}
#apPanel select{flex:1;max-width:none;font-size:.85rem;padding:.35rem .4rem}
#apPanel .ap-name{flex:1;min-width:0;font:inherit;font-size:.9rem;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;height:2.2rem;padding:0 .8rem;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:start}
#apSel{display:grid;gap:.5rem;max-height:56vh;overflow:auto}
#apSel .apr{display:grid;grid-template-columns:1fr 1fr;gap:.4rem}
#apSel .selbtn{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:2.6rem;font-size:.95rem;font-weight:700;border-radius:10px;padding:.3rem .6rem;text-align:right}
#apSel .selbtn::after{content:'⌄';font-size:1.1rem;line-height:1;color:var(--muted)}
#apSel .selbtn.c{justify-content:center;gap:.5rem}
#apSel .recp.c button{text-align:center}
#apSel .recp.r button{text-align:right}
#apSel .recp.r{max-height:min(22.5rem,48vh)}
#apSel .dlrow .selbtn{flex:1;min-width:0}
#apSel .recp{position:relative;max-height:11rem;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--bg);-webkit-overflow-scrolling:touch}
#apSel .recp button{display:block;width:100%;text-align:center;border:0;border-bottom:1px solid var(--line);border-radius:0;font-size:.95rem;min-height:2.5rem;padding:.5rem .7rem;white-space:nowrap}
#apSel .recp button{font-weight:700}
#apSel .recp button:nth-child(odd){background:#dde8e1}
#apSel .recp button:nth-child(even){background:#fff}
#apSel .recp button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
#apSel .recp button:last-child{border-bottom:0}
#apSel .sl{display:grid;gap:.2rem;font-size:.78rem;color:var(--muted);font-weight:700}
#apSel select{font:inherit;font-weight:700;font-size:.95rem;width:100%;max-width:none;min-height:2.6rem;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:.3rem .5rem}
#apSel .aprep{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem}
#apSel button{font:inherit;font-size:.85rem;min-height:2.2rem;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:.2rem .3rem;cursor:pointer}
#apSel button{font-weight:700}
.tools button,.seg button,.set .act,.go button,.endnav button,#shSheet button,#instSheet button,#bmSheet button,.sh-top button{font-weight:700}
#apSel button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
#apSel .dlrow{display:flex;gap:.4rem}
#apSel .dlrow select{flex:1;max-width:none;font-size:.85rem;padding:.35rem .4rem}
#apSel .dlrow button{flex:none;min-width:5.5rem}
#apSel #dlSt{margin:.3rem 0 0;font-size:.78rem;color:var(--muted);text-align:center}
#apSel #dlSt.full{font-size:.92rem;font-weight:700;color:#b3261e;background:#fdf1f0;border:1px solid #f0c4c0;border-radius:10px;padding:.5rem .6rem;line-height:1.6}
#apPanel.opt .ap-name,#apPanel.opt .ap-x{height:1.9rem;font-size:.92rem;font-weight:700;padding:0 .7rem;border-radius:8px}
#apPanel.opt .ap-name{flex:none;width:auto;max-width:70%}
#apPanel.opt .ap-x{margin-inline-start:auto}
#apSel #apDone{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
body.ao #play,body.ao .speed{display:none}
body.ao .apc{display:flex}
body.ao.fr .bar-in{flex-wrap:wrap;row-gap:.5rem}
body.ao.fr .bar-in::after{content:'';order:3;flex-basis:100%;height:0}
body.ao.fr #fab2{order:0}body.ao.fr .apc{order:1}body.ao.fr #fab{order:2}
body.ao.fr #play{display:grid;order:4;width:2.8rem;height:2.8rem}
body.ao.fr .speed{display:flex;order:4}
.apc{display:none;flex:1;justify-content:center;align-items:center;gap:.8rem;direction:ltr}
.apc button{font:inherit;font-size:1.2rem;width:2.8rem;height:2.8rem;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer;padding:0}
.apc #apPlay{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);width:3.4rem;height:3.4rem}
#fab,#fab2{position:static!important;flex:none;width:2.8rem!important;height:2.8rem!important;font-size:1.2rem!important;box-shadow:none!important}
#fab{background:var(--surface)!important;color:var(--accent)!important;border:1.5px solid var(--accent)!important}
body.vo #fab{background:#d33!important;border-color:#d33!important}
#apPanel .ap-x{flex:none;font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;height:2.2rem;padding:0 .8rem;cursor:pointer}
#apPanel .ap-ctl{justify-content:center;gap:1rem;direction:ltr}
#apPanel .ap-ctl button{font:inherit;font-size:1.3rem;width:3rem;height:3rem;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer;padding:0}
#apPanel .ap-ctl #apPlay{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);width:3.4rem;height:3.4rem}
#apPanel .ap-note{margin:0;text-align:center;font-size:.75rem;color:var(--muted)}
</style>

function verseAt(y){
  for (const f of [.5,.3,.7,.15,.85]){

    if (document.caretRangeFromPoint){ const r=document.caretRangeFromPoint(x,y); n=r&&r.startContainer; }
    else if (document.caretPositionFromPoint){ const r=document.caretPositionFromPoint(x,y); n=r&&r.offsetNode; }
    if (!n) n=document.elementFromPoint(x,y);
    const e=n&&(n.nodeType===1?n:n.parentElement); const v=e&&e.closest&&e.closest('.v');
    if (v) return v;
  }
  return null;
}
function versesAtLine(y){
  const all=document.querySelectorAll('.v');
  const lh=parseFloat(getComputedStyle(document.querySelector('.v')||document.body).lineHeight)||60;
  const frags=[]; let L=1e9,R=-1e9,sTop=null,sH=0;
  for (const v of all){
    const rects=v.getClientRects(); if(!rects.length) continue;
    if (rects[0].top-lh>y) break;
    for (const q of rects){
      if (q.height<lh*0.25) continue;
      const st=q.top-(lh-q.height)/2; // شرائح السطور متجاورة بلا تداخل
      if (y<st||y>=st+lh) continue;
      if (sTop===null) sTop=st;
      else if (Math.abs(st-sTop)>lh*0.5) continue;
      frags.push([v,q]); L=Math.min(L,q.left); R=Math.max(R,q.right);
    }
  }
  let best=null;
  if (frags.length){
    // تقدّم الخط داخل السطر (أعلى→أسفل) يقابل القراءة (يمين→يسار): كل آية في السطر تأخذ دورها
    const t=Math.min(1,Math.max(0,(y-sTop)/lh)), x=R-t*(R-L); let bs=1e9;
    for (const [v,q] of frags){ const d=x<q.left?q.left-x:x>q.right?x-q.right:0; if(d<bs){bs=d;best=v;} }
  }
  if (all.length&&scrollY<4) best=all[0]; // أعلى الصفحة: الآية الأولى
  if (all.length&&scrollY+innerHeight>=document.documentElement.scrollHeight-4&&y<all[all.length-1].getBoundingClientRect().top) best=all[all.length-1];
  return best?[best]:[];
}

function nz(s,dagger){
  return s.replace(/\u0670/g,dagger?'ا':'').replace(/[\u064b-\u065f\u06d6-\u06ed\u0640]/g,'')
    .replace(/[آأإٱ]/g,'ا').replace(/[ىی]/g,'ي').replace(/ک/g,'ك').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/ء/g,'');
}
function buildIdx(){
  idx=[];
  for (let j=1;j<=30;j++) for (const [s,a,t0] of juz[j]){
    let t=t0; if (a===1 && s!==1 && s!==9) t=t.split(' ').slice(4).join(' ');
    t=t.replace(/[\u06e9\u06de]/g,'');
    idx.push({s,a,show:t.replace(/[\u06d6-\u06dc]/g,'').replace(/ {2,}/g,' ').trim(),A:nz(t,false),B:nz(t,true)});
  }
}
const sheet=$('sheet'), qEl=$('q'), qlist=$('qlist'), qinfo=$('qinfo');
let qSeq=0;
async function runSearch(){
  const my=++qSeq;
  const q=nz(norm(qEl.value),false).replace(/\s+/g,' ').trim();
  qlist.textContent='';
  if (q.length<2){ qinfo.textContent='اكتب حرفين على الأقل. البحث بلا تشكيل، والألف والهمزة والتاء المربوطة تتساوى.'; return; }
  if (!idx){
    qinfo.textContent='جاري تجهيز البحث…';
    try{ await ensureAll(n=>{ if(my===qSeq) qinfo.textContent='جاري تجهيز البحث… '+ar(n)+' / ٣٠'; }); }
    catch(e){ if(my===qSeq) qinfo.textContent='تعذر تجهيز البحث. تحقق من الاتصال بالإنترنت وأعد المحاولة.'; return; }
    if (!idx) buildIdx();
  }
  if (my!==qSeq) return;
  const out=[]; let total=0;
  for (const e of idx){
    if (e.A.includes(q) || e.B.includes(q)){ total++; if (out.length<100) out.push(e); }
  }
  qinfo.textContent = total===0 ? 'لا توجد نتائج لـ «'+qEl.value.trim()+'».' : (total>100 ? 'أول ١٠٠ نتيجة من '+ar(total) : ar(total)+(total<=10?' نتائج':' نتيجة'));
  const frag=document.createDocumentFragment();
  for (const e of out){
    const b=document.createElement('button'); b.type='button'; b.className='hit';
    const h=document.createElement('b'); h.textContent='سورة '+names[e.s]+' · آية '+ar(e.a);
    const sp=document.createElement('span'); sp.textContent=e.show.length>150?e.show.slice(0,150)+'…':e.show;
    b.append(h,sp);
    b.addEventListener('click',()=>{ closeSheet(); stop(); rememberBack(); render(ayahJuz[e.s+':'+e.a],null,{s:e.s,a:e.a}); });
    frag.appendChild(b);
  }
  qlist.appendChild(frag);
}

qEl.addEventListener('input',()=>{ clearTimeout(qT); qT=setTimeout(runSearch,150); });

let backV=null;
function curVerse(){ const l=versesAtLine(Math.round(innerHeight*0.38)); return l[0]||verseAt(Math.round(innerHeight*0.38)); }
function rememberBack(){
  const v=curVerse(); if(!v) return;
  backV={s:+v.dataset.s,a:+v.dataset.a};
  $('backGo').textContent='↩ رجوع إلى سورة '+names[backV.s]+' · آية '+ar(backV.a);

// ---- العلامات المتعددة ----
function saveBms(){ store.set('bms',bms); bmKeys=new Set(bms.map(b=>b.s+':'+b.a)); }
function snippetOf(v){ const t=v.textContent.replace(/[\u06d6-\u06dc\u06e9\u06de﴿﴾]/g,'').replace(/[٠-٩]+/g,'').replace(/\s+/g,' ').trim(); return t.split(' ').slice(0,8).join(' ')+'…'; }
function markVerse(s,a,on){ const v=$('text').querySelector('.v[data-s="'+s+'"][data-a="'+a+'"]'); if(v) v.classList.toggle('bm',on); }
function toggleBm(v){
  const s=+v.dataset.s, a=+v.dataset.a, k=s+':'+a, i=bms.findIndex(b=>b.s===s&&b.a===a);
  if (i>=0){ bms.splice(i,1); saveBms(); markVerse(s,a,false); return false; }
  bms.unshift({s,a,j:ayahJuz[k],txt:snippetOf(v),t:Date.now()}); if(bms.length>200) bms.length=200;
  saveBms(); markVerse(s,a,true); return true;
}
function renderBms(){
  const list=$('bmList'); list.textContent='';
  $('bmInfo').textContent = bms.length ? (bms.length===1?'علامة واحدة':ar(bms.length)+(bms.length<=10?' علامات':' علامة'))+' محفوظة على هذا الجهاز. اضغط على الآية في النص لإضافة علامة.' : 'لا توجد علامات بعد. اضغط على أي آية في النص ثم «إضافة علامة»، أو استخدم الزر أعلاه.';
  for (const b of bms){
    const row=document.createElement('div'); row.className='bm-row';
    const open=document.createElement('button'); open.type='button'; open.className='hit';
    const h=document.createElement('b'); h.textContent='سورة '+names[b.s]+' · آية '+ar(b.a)+' · الجزء '+ar(b.j);
    const sp=document.createElement('span'); sp.textContent=b.txt||'';
    open.append(h,sp);
    open.addEventListener('click',()=>{ closeBm(); stop(); rememberBack(); render(b.j,null,{s:b.s,a:b.a}); });
    const del=document.createElement('button'); del.type='button'; del.className='del'; del.textContent='حذف'; del.setAttribute('aria-label','حذف العلامة');
    del.addEventListener('click',()=>{ bms=bms.filter(x=>x!==b); saveBms(); markVerse(b.s,b.a,false); renderBms(); });
    row.append(open,del); list.appendChild(row);
  }
}
function openBm(){ stop(); goPanel.hidden=true; setPanel.hidden=true; renderBms(); $('bmSheet').hidden=false; }
function closeBm(){ $('bmSheet').hidden=true; }

let shV=null;
function shData(){ const s=+shV.dataset.s, a=+shV.dataset.a; const t=vTxt(shV).replace(/[\u06d6-\u06dc\u06e9\u06de]/g,'').replace(/\s+/g,' ').trim(); return {s,a,t,ref:'سورة '+names[s]+' · آية '+ar(a)}; }
function shOpen(){ if(!vpV) return; shV=vpV; hideVp(); const d=shData(); $('shTitle').textContent=d.ref; $('shTxt').textContent=d.t; $('shSheet').hidden=false; }
function shClose(){ $('shSheet').hidden=true; shV=null; }
function shMsg(d){ return d.t+' ﴿'+ar(d.a)+'﴾\n['+d.ref+']\nالقرآن الكريم · qurank.app'; }
async function shCopy(){ const d=shData(); try{ await navigator.clipboard.writeText(shMsg(d)); toast('تم نسخ الآية'); }catch(e){ toast('تعذر النسخ'); } shClose(); }
async function shText(){ const d=shData(); try{ if(navigator.share) await navigator.share({text:shMsg(d)}); else { await navigator.clipboard.writeText(shMsg(d)); toast('تم نسخ الآية'); } }catch(e){} shClose(); }
function shWrap(ctx,text,w){ const ws=text.split(' '), lines=[]; let cur=''; for (const x of ws){ const t=cur?cur+' '+x:x; if (ctx.measureText(t).width>w && cur){ lines.push(cur); cur=x; } else cur=t; } if(cur) lines.push(cur); return lines; }
async function shImage(){
  const d=shData(); shClose(); toast('جارٍ تجهيز الصورة…');
  try{ await Promise.race([document.fonts.load('48px "Amiri Quran"'),new Promise(r=>setTimeout(r,2000))]); }catch(e){}
  const W=1080,H=1350, c=document.createElement('canvas'); c.width=W; c.height=H; const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,W,H); g.addColorStop(0,'#123628'); g.addColorStop(1,'#1d6a50'); x.fillStyle=g; x.fillRect(0,0,W,H);
  x.strokeStyle='#d4b45a'; x.lineWidth=3; x.strokeRect(50,50,W-100,H-100); x.lineWidth=1; x.strokeRect(64,64,W-128,H-128);
  x.direction='rtl'; x.textAlign='center'; x.textBaseline='alphabetic';
  const FF='"Amiri Quran","Scheherazade New","Traditional Arabic",serif', txt=d.t+' ﴿'+ar(d.a)+'﴾', maxW=W-240, maxH=H-520;
  let size=84, lines;
  for (; size>=34; size-=4){ x.font=size+'px '+FF; lines=shWrap(x,txt,maxW); if (lines.length*size*1.95<=maxH) break; }
  const lh=size*1.95, total=lines.length*lh; let y=(H-total)/2+size*0.45-30;
  x.fillStyle='#ffffff'; lines.forEach((l,i)=>x.fillText(l,W/2,y+i*lh));
  x.fillStyle='#d4b45a'; x.font='44px '+FF; x.fillText(d.ref,W/2,H-190);
  x.fillStyle='rgba(255,255,255,.7)'; x.font='30px "IBM Plex Sans Arabic",sans-serif'; x.fillText('القرآن الكريم',W/2,H-130);
  c.toBlob(async b=>{
    if(!b){ toast('تعذر تجهيز الصورة'); return; }
    const file=new File([b],'ayah.png',{type:'image/png'});
    try{
      if (navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file]}); return; }
    }catch(e){ if (e && e.name==='AbortError') return; }
    const u=URL.createObjectURL(b), a=document.createElement('a'); a.href=u; a.download='ayah.png'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000); toast('تم حفظ الصورة');
  },'image/png');
}

function instImgsShow(on,lang){
  const box=$('instImgs'); if(!on){ box.hidden=true; return; }
  lang=lang||((navigator.language||'').toLowerCase().indexOf('ar')===0?'ar':'en');
  const set=INST_IMGS[lang];
  box.innerHTML='<div class="tabs"><button type="button" data-l="en" class="'+(lang==='en'?'on':'')+'">iPhone إنجليزي</button><button type="button" data-l="ar" class="'+(lang==='ar'?'on':'')+'">iPhone عربي</button></div><div class="strip">'+set.map((x,i)=>'<figure><img src="data:image/jpeg;base64,'+x[0]+'" alt=""><figcaption>'+ar(i+1)+'. '+x[1]+'</figcaption></figure>').join('')+'</div>';
  box.hidden=false;
  box.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>instImgsShow(true,b.dataset.l));
  box.querySelectorAll('img').forEach(im=>im.onclick=()=>{ $('instZoom').firstElementChild.src=im.src; $('instZoom').hidden=false; });
}
$('instZoom').addEventListener('click',()=>{ $('instZoom').hidden=true; });

function showSheet(title,steps,okText,after){
  instImgsShow(false);
  $('instTitle').textContent=title; $('instSteps').innerHTML=steps.map(s=>'<li>'+s+'</li>').join('');
  $('instArrow').hidden=true; $('instOk').textContent=okText||'حسنًا'; instAfter=after||null; $('instSheet').hidden=false;
}
function micHelp(kind){
  const app=LOCAL_Q;
  if (kind==='service-not-allowed') showSheet('فعّل الإملاء الصوتي',[
    'افتح <b>الإعدادات ← عام ← لوحة المفاتيح</b>.','شغّل <b>تفعيل الإملاء</b>.','تأكد أن <b>Siri</b> مفعّل (الإعدادات ← Siri).','ارجع هنا واضغط 🎤 من جديد.']);
  else if (app) showSheet('الميكروفون غير مسموح',[
    'افتح <b>الإعدادات ← القرآن الكريم</b>.','فعّل <b>الميكروفون</b> و<b>التعرف على الكلام</b>.','ارجع هنا واضغط 🎤 من جديد.']);
  else showSheet('الميكروفون غير مسموح',[
    'افتح <b>الإعدادات ← Safari ← الميكروفون</b> واختر «اسأل» أو «سماح».','أو اضغط <b>أA</b> في شريط Safari ← <b>إعدادات الموقع</b> ← الميكروفون ← «سماح».','ارجع هنا واضغط 🎤 من جديد.']);
}
function micIntro(go){
  showSheet('القراءة الصوتية',[
    'اضغط «سماح» عندما يطلب الميكروفون.','اقرأ بصوت واضح، وتتبع الآية تلقائيًا.','للانتقال قل: <b>سورة الملك</b> أو <b>الجزء ٥</b> أو <b>الجزء التالي</b>.','للإيقاف اضغط 🎤 أو قل <b>وقف</b>.'],'ابدأ',go);
}
// تنزيل القرآن بهدوء في الخلفية بعد أول فتح (بدون زر)
(function(){
  if (LOCAL_Q) return;
  try{ const c=navigator.connection; if(c && c.saveData) return; }catch(e){}
  const go=async()=>{ for (let j=1;j<=30;j++){ if(juz[j]) continue; try{ await loadJuz(j); }catch(e){ return; } await new Promise(r=>setTimeout(r,400)); } };
  setTimeout(()=>{ if('requestIdleCallback' in window) requestIdleCallback(go,{timeout:8000}); else go(); },6000);
})();
if (typeof ensureAll==='function'){
  $('offBtn').hidden=true;
  $('offBtn').addEventListener('click',async()=>{
    $('offBtn').disabled=true; setNote('جاري التحميل… ٠ / ٣٠');
    try{ await ensureAll(n=>setNote('جاري التحميل… '+ar(n)+' / ٣٠')); setNote('تم تحميل القرآن كاملًا على جهازك ✓ . النص يُفتح الآن بلا إنترنت، لكن الصفحة نفسها تحتاج اتصال عند فتحها.'); }
    catch(e){ setNote('تعذر إكمال التحميل. تحقق من الاتصال وأعد المحاولة.'); }
    $('offBtn').disabled=false;

function syncTopSurah(){ try{ const v=curVerse(); if(v && surahSel.value!==v.dataset.s) surahSel.value=v.dataset.s; }catch(e){} }
let syncT=0;
addEventListener('scroll',()=>{ clearTimeout(saveT); saveT=setTimeout(savePlace,300); if(!syncT) syncT=setTimeout(()=>{ syncT=0; syncTopSurah(); },350); },{passive:true});
setInterval(syncTopSurah,1500);
addEventListener('pagehide',savePlace);
document.addEventListener('visibilitychange',()=>{ if(document.hidden) savePlace(); });
function placeAt(v){ const r=v.getBoundingClientRect(); window.scrollTo(0,r.top+window.scrollY-innerHeight*0.38); pos=window.scrollY; scheduleGuide(); }
let moved=false;
['touchstart','wheel','mousedown','keydown'].forEach(ev=>addEventListener(ev,()=>{ moved=true; },{passive:true,once:true}));
const place=store.get('place',null);
const hasPlace=!!(place && ayahJuz[place.s+':'+place.a]);
(async()=>{
  await render(hasPlace ? ayahJuz[place.s+':'+place.a] : store.get('juz',1));
  if (hasPlace){
    const v=$('text').querySelector('.v[data-s="'+place.s+'"][data-a="'+place.a+'"]');
    if (v){
      placeAt(v);
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ if(!moved && v.isConnected) placeAt(v); });
    }
  }
})();
})();
</script>

<script>
// نسخ احتياطي / استعادة (العلامات، مكان القراءة، الإعدادات)
(function(){
  const g=id=>document.getElementById(id);
  const note=m=>{ const n=g('setNote'); if(n){ n.textContent=m; n.hidden=!m; } };
  function collect(){
    const o={app:'quran',v:1,t:Date.now(),d:{}};
    for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&(k.indexOf('mq_')===0||k==='qk-id')) o.d[k]=localStorage.getItem(k); }
    return o;
  }
  async function copy(s){ try{ await navigator.clipboard.writeText(s); return true; }catch(e){ try{ const t=document.createElement('textarea'); t.value=s; document.body.appendChild(t); t.select(); const ok=document.execCommand('copy'); t.remove(); return ok; }catch(_){ return false; } } }
  g('bkExp').addEventListener('click',async()=>{
    const o=collect(), n=Object.keys(o.d).length;
    if(!n){ note('ما في بيانات للنسخ بعد.'); return; }
    const s=JSON.stringify(o); const ok=await copy(s);
    note(ok?'تم نسخ النسخة الاحتياطية ✓ . الصقها في ملاحظات أو أرسلها لنفسك على واتساب، ثم استعدها من الموقع الجديد.':'تعذر النسخ تلقائيًا، جرّب مرة ثانية.');
    try{ if(navigator.share) await navigator.share({title:'نسخة القرآن الكريم',text:s}); }catch(e){}
  });
  g('bkImp').addEventListener('click',()=>{
    if(g('bkBox')) return;
    const b=document.createElement('div'); b.id='bkBox';
    b.style.cssText='position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px';
    b.innerHTML='<div style="background:var(--bg,#fff);color:var(--fg,#222);border-radius:16px;padding:16px;width:100%;max-width:420px;font-family:inherit" dir="rtl"><h3 style="margin:0 0 8px">استعادة نسخة احتياطية</h3><p style="margin:0 0 8px;font-size:.9rem;opacity:.8">الصق النص الذي نسخته سابقًا:</p><textarea id="bkTa" dir="ltr" style="width:100%;height:120px;font-size:14px;border-radius:10px;padding:8px;box-sizing:border-box"></textarea><div style="display:flex;gap:8px;margin-top:10px"><button id="bkGo" type="button" style="flex:1;padding:12px;border-radius:10px;border:0;background:#1f6f54;color:#fff;font-weight:700;font-size:1rem">استعادة</button><button id="bkNo" type="button" style="flex:1;padding:12px;border-radius:10px;border:1px solid #888;background:transparent;color:inherit;font-size:1rem">إلغاء</button></div><p id="bkMsg" style="margin:8px 0 0;font-size:.9rem"></p></div>';
    document.body.appendChild(b);
    g('bkNo').onclick=()=>b.remove();
    g('bkGo').onclick=()=>{
      try{
        const o=JSON.parse(g('bkTa').value.trim());
        if(!o||o.app!=='quran'||!o.d) throw 0;
        let c=0; for(const k in o.d){ if(k.indexOf('mq_')===0||k==='qk-id'){ localStorage.setItem(k,o.d[k]); c++; } }
        g('bkMsg').textContent='تمت الاستعادة ✓ ('+c+') جاري إعادة التحميل…';
        setTimeout(()=>location.reload(),900);
      }catch(e){ g('bkMsg').textContent='النص غير صحيح، انسخه كاملًا من النسخة الاحتياطية.'; }
    };
  });
})();
</script>
<script>
// عدّاد زيارات بسيط (رقم عشوائي للجهاز فقط، بدون أي بيانات شخصية)
(function(){
  try{
    if (!/(\.github\.io|^(www\.)?qurank\.app)$/i.test(location.hostname)) return;
    if (sessionStorage.getItem('qk-cnt')) return; sessionStorage.setItem('qk-cnt','1');
    const B='https://khatmat-quraan-default-rtdb.europe-west1.firebasedatabase.app/khatma/mushafStats';
    let id=localStorage.getItem('qk-id'), isNew=false;
    if (!id){ id=(Date.now().toString(36)+Math.random().toString(36).slice(2,8)); localStorage.setItem('qk-id',id); isNew=true; }
    const now=Date.now(), d=new Date(now+3*3600*1000).toISOString().slice(0,10); // تاريخ الكويت
    const put=(p,v)=>fetch(B+p+'.json',{method:'PUT',body:JSON.stringify(v),keepalive:true}).catch(()=>{});
    const inc={'.sv':{increment:1}};
    setTimeout(()=>{
      put('/total/opens',inc);
      put('/days/'+d+'/opens',inc);
      put('/days/'+d+'/dev/'+id,true);
      put('/devices/'+id+'/last',now);
      if (isNew){ put('/devices/'+id+'/first',now); put('/total/devices',inc); }
    },4000);
  }catch(e){}
})();
</script>
